name: editflow

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-editflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-editflow-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-editflow_dev}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-editflow_test}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - editflow_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  editflow_postgres_data:

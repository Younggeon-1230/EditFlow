services:
  - type: web
    name: editflow
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    numInstances: 1
    healthCheckPath: /health/live
    autoDeployTrigger: off
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: lax
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_TIMEOUT_SECONDS
        value: "30"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "300"
      - key: LLM_LIVE_CALLS_ENABLED
        value: "false"
      - key: LLM_RECOMMENDATION_SIGNING_SECRET
        generateValue: true
